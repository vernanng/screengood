name: CI

# Build and test the Rust project with Cargo.
# The crate links macOS frameworks (CoreGraphics/ApplicationServices via
# core-graphics/core-foundation), so CI must run on a macOS runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run built-in selftest
        run: ./target/release/screengood test

      - name: Assemble and sign app bundle
        run: |
          ./target/release/screengood make-app
          codesign --verify --strict ScreenGood.app
          codesign -dv ScreenGood.app

      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent ScreenGood.app ScreenGood-macOS-arm64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenGood-macOS-arm64
          path: ScreenGood-macOS-arm64.zip
          if-no-files-found: error
